name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages serves everything with max-age=600, so a browser can keep running the
      # previous deploy's modules. Versioning every import makes a new deploy a new URL.
      - name: Stamp asset versions
        run: |
          V=${GITHUB_SHA::8}
          mkdir dist
          cp -R index.html 404.html css js assets dist/
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$V'#g" dist/js/*.js
          sed -i -E "s#(js/app\.js|css/(tokens|styles)\.css)\"#\1?v=$V\"#" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
