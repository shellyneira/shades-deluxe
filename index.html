<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Theme before first paint, so a dark-theme reload never flashes light.
    (function () {
      var t = null;
      try { t = localStorage.getItem('sd-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script>
    // Deep links: 404.html bounces unknown paths here as /?/quotes/q_1; put the real path back.
    (function () {
      var gh = location.hostname.slice(-10) === '.github.io';
      var base = gh ? '/' + location.pathname.split('/')[1] + '/' : '/';
      var q = location.search;
      if (q.charAt(1) === '/') history.replaceState(null, '', base + q.slice(2).replace(/~and~/g, '&') + location.hash);
      document.write('<base href="' + base + '">');
    })();
  </script>
  <title>Shades Deluxe — Quotes</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="topbar no-print">
    <div class="brand"><img class="brand-logo" src="assets/logo.png" alt="" /><span>Shades Deluxe</span></div>
    <nav class="tabs">
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="quotes">Quotes</button>
      <button class="tab" data-view="tables">Price Tables</button>
      <button class="tab" data-view="lists">Lists</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast no-print" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
